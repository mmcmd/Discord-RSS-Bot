name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The test stage of the Dockerfile runs ruff and then pytest; the build fails if either does.
      - name: Lint and test
        run: docker build --target test .
